[project]
name = "rmd-api"
version = "0.1.0"
description = "RMD LLM V2 API: multilingual grounded question answering over spiritual teachings"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "redis>=5.0,<6",
    "rq>=1.16,<2",
    "httpx>=0.27,<1",
    "openai>=1.40,<2",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.10,<1",
    "pillow>=10,<12",
    "python-multipart>=0.0.9,<1",
    "structlog>=24,<26",
    "tenacity>=8,<10",
    "rank-bm25>=0.2.2,<1",
    "python-jose[cryptography]>=3.3,<4",
    "slowapi>=0.1.9,<1",
    "orjson>=3.10,<4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "respx>=0.21,<1",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
