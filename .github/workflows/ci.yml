name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rmd
          POSTGRES_PASSWORD: rmd
          POSTGRES_DB: rmd
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rmd -d rmd" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://rmd:rmd@localhost:5433/rmd
      REDIS_URL: redis://localhost:6380/0
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check rmd tests alembic
      - run: .venv/bin/ruff format --check rmd tests alembic
      - run: .venv/bin/alembic upgrade head
      - run: .venv/bin/alembic check
      - run: .venv/bin/pytest -q
      - run: .venv/bin/pip-audit --skip-editable
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
